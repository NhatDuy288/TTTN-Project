<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tổng quan | Quản lý kho vật tư</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand-link" th:href="@{/dashboard}">Quản lý nguyên vật liệu thẻ</a>
    <div class="topbar-actions">
        <div class="topbar-profile">
            <strong th:text="${displayName}">Người dùng</strong>
            <span class="role" th:text="${role}">ROLE</span>
        </div>
        <form method="post" th:action="@{/logout}">
            <button class="button-secondary" type="submit">Đăng xuất</button>
        </form>
    </div>
</header>

<main class="page-shell">
    <div class="dashboard-intro">
        <p class="eyebrow">Màn hình chính</p>
        <h1>Tổng quan</h1>
        <p class="muted">Chọn chức năng nghiệp vụ phù hợp với vai trò hiện tại.</p>
    </div>

    <section class="shortcut-grid" aria-label="Chức năng theo vai trò">
        <a class="shortcut" th:each="shortcut : ${shortcuts}"
           th:href="${shortcut.path}"
           th:text="${shortcut.label}">Chức năng</a>
    </section>
</main>
</body>
</html>
