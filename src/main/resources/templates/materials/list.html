<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh sách vật tư | Quản lý kho vật tư</title>
<link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head>
<body>
<header class="topbar"><a class="brand-link" th:href="@{/dashboard}">Quản lý kho vật tư</a>
<form method="post" th:action="@{/logout}"><button class="button-secondary" type="submit">Đăng xuất</button></form></header>
<main class="page-shell">
<div class="page-heading"><div><p class="eyebrow">UC-02 / UC-03</p><h1>Danh sách vật tư</h1></div>
<a class="button-link" th:if="${canManage}" th:href="@{/materials/new}">Thêm vật tư</a></div>
<form class="filter-panel" method="get" th:action="@{/materials}">
<div><label for="materialGroupId">Nhóm vật tư</label><select id="materialGroupId" name="materialGroupId">
<option value="">Tất cả</option><option th:each="group : ${groups}" th:value="${group.id}" th:selected="${group.id == materialGroupId}" th:text="${group.code + ' - ' + group.name}">Nhóm</option>
</select></div>
<div><label for="codeOrName">Mã hoặc tên</label><input id="codeOrName" name="codeOrName" th:value="${codeOrName}" placeholder="Nhập từ khóa"></div>
<div><label for="status">Trạng thái</label><select id="status" name="status"><option value="">Tất cả</option>
<option th:each="item : ${statuses}" th:value="${item}" th:selected="${item == selectedStatus}" th:text="${item.name() == 'ACTIVE' ? 'Hoạt động' : 'Không hoạt động'}">Trạng thái</option>
</select></div>
<div><label for="size">Số dòng</label><select id="size" name="size"><option th:each="item : ${pageSizes}" th:value="${item}" th:selected="${item == selectedSize}" th:text="${item}">20</option></select></div>
<button type="submit">Tìm kiếm</button></form>
<div class="table-wrap"><table><thead><tr><th>Mã vật tư</th><th>Tên vật tư</th><th>Nhóm</th><th>Đơn vị</th><th>GL Code</th><th>Trạng thái</th></tr></thead><tbody>
<tr th:each="item : ${pageData.content}">
<td><a th:href="@{/materials/{id}(id=${item.id})}" th:text="${item.materialCode}">MAT-001</a></td>
<td th:text="${item.materialName}">Tên</td><td th:text="${item.materialGroup.code + ' - ' + item.materialGroup.name}">Nhóm</td>
<td th:text="${item.unit.displayName}">Bộ</td><td th:text="${item.glCode != null ? item.glCode : '-'}">-</td>
<td><span class="status-pill" th:classappend="${item.status.name() == 'ACTIVE'} ? ' status-active' : ' status-inactive'" th:text="${item.status.name() == 'ACTIVE' ? 'Hoạt động' : 'Không hoạt động'}">Hoạt động</span></td></tr>
<tr th:if="${pageData.empty}"><td colspan="6" class="empty-state">Không có vật tư phù hợp.</td></tr>
</tbody></table></div>
<nav class="pagination" th:if="${pageData.totalPages > 1}" aria-label="Phân trang">
<a th:if="${pageData.hasPrevious()}" th:href="@{/materials(materialGroupId=${materialGroupId},codeOrName=${codeOrName},status=${selectedStatus},page=${pageData.number - 1},size=${selectedSize})}">Trang trước</a>
<span th:text="${'Trang ' + (pageData.number + 1) + ' / ' + pageData.totalPages}">Trang 1</span>
<a th:if="${pageData.hasNext()}" th:href="@{/materials(materialGroupId=${materialGroupId},codeOrName=${codeOrName},status=${selectedStatus},page=${pageData.number + 1},size=${selectedSize})}">Trang sau</a>
</nav></main></body></html>
