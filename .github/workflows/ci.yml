name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, integration and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enable Maven Wrapper
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B -ntp test

      - name: Run PostgreSQL integration tests
        run: ./mvnw -B -ntp -Dtest='*IT' test

      - name: Package application
        run: ./mvnw -B -ntp -DskipTests package
